[project]
name = "orbita-backend"
version = "0.1.0"
description = "Órbita API"
requires-python = ">=3.14"
dependencies = [
    # Web framework and ASGI server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Database and ORM: SQLAlchemy 2.1 switches the default postgresql:// driver to psycopg v3; we use psycopg2
    "sqlalchemy>=2.0.0,<2.1",
    "psycopg2-binary>=2.9.0",
    # Schema migrations
    "alembic>=1.19,<2",
    # Validation and settings (reads .env)
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    # Auth: the crypto extra verifies Google id_tokens (RS256)
    "PyJWT[crypto]>=2.15.1,<3",
    "bcrypt>=4.0.1",
    # HTTP client (Google OAuth)
    "httpx>=0.25.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "ruff>=0.6.0",
]

[tool.uv]
# Application, not a library: uv sync installs the dependencies without installing the project itself
package = false
default-groups = ["test", "dev"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
# E/F: errors and pyflakes · I: import order · B: common bugs · UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
